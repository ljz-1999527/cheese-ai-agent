<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="32" fill="url(#bg)"/>
  <!-- 机器人头像 -->
  <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 天线 -->
    <line x1="32" y1="10" x2="32" y2="16"/>
    <circle cx="32" cy="8" r="2" fill="#fff" stroke="none"/>
    <!-- 头部 -->
    <rect x="16" y="16" width="32" height="26" rx="6"/>
    <!-- 眼睛 -->
    <circle cx="25" cy="28" r="3" fill="#fff" stroke="none"/>
    <circle cx="39" cy="28" r="3" fill="#fff" stroke="none"/>
    <!-- 嘴 -->
    <line x1="26" y1="38" x2="38" y2="38"/>
    <!-- 耳朵 -->
    <rect x="12" y="24" width="4" height="10" rx="2"/>
    <rect x="48" y="24" width="4" height="10" rx="2"/>
  </g>
</svg>
